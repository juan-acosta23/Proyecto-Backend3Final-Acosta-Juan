paths:
  /api/users/:
    get:
      summary: Obtiene todos los usuarios
      description: |
        Retorna la lista completa de usuarios registrados en el sistema.
        **Solo disponible para administradores.**
        Las contraseñas nunca se incluyen en la respuesta (DTO).
      tags:
        - Users
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lista de usuarios obtenida correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserAdmin'
                  count:
                    type: integer
                    example: 2
                  message:
                    type: string
                    example: "2 usuario(s) encontrado(s)"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/users/{uid}:
    get:
      summary: Obtiene un usuario por ID
      description: |
        Retorna los datos de un usuario específico. Un usuario puede ver su
        propio perfil; los administradores pueden ver cualquier perfil.
        La vista del admin incluye campos adicionales como `cart` y `createdAt`.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: Usuario encontrado correctamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/UserAdmin'
        "400":
          $ref: '#/components/responses/InvalidId'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

    put:
      summary: Actualiza un usuario por ID
      description: |
        Actualiza los datos de un usuario. Un usuario solo puede modificar su
        propio perfil; los administradores pueden modificar cualquier perfil.
        **No se puede modificar el email ni el rol a través de este endpoint.**
        Para cambiar el rol, usar `PUT /api/users/{uid}/role`.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
            example:
              first_name: "Juan Carlos"
              last_name: "Acosta"
              age: 26
      responses:
        "200":
          description: Usuario actualizado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/User'
                  message:
                    type: string
                    example: Usuario actualizado exitosamente
        "400":
          $ref: '#/components/responses/InvalidId'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

    delete:
      summary: Elimina un usuario por ID
      description: |
        Elimina permanentemente un usuario del sistema.
        **Solo disponible para administradores.**
        La respuesta incluye los datos mínimos del usuario eliminado como confirmación.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        "200":
          description: Usuario eliminado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/UserMinimal'
                  message:
                    type: string
                    example: Usuario eliminado exitosamente
        "400":
          $ref: '#/components/responses/InvalidId'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "500":
          $ref: '#/components/responses/InternalError'

  /api/users/{uid}/role:
    put:
      summary: Actualiza el rol de un usuario
      description: |
        Permite a un administrador cambiar el rol de cualquier usuario.
        Roles disponibles: `user`, `admin`, `premium`.
      tags:
        - Users
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [user, admin, premium]
                  description: Nuevo rol para el usuario.
                  example: premium
      responses:
        "200":
          description: Rol actualizado exitosamente.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: success
                  payload:
                    $ref: '#/components/schemas/UserAdmin'
                  message:
                    type: string
                    example: Rol actualizado a premium exitosamente
        "400":
          description: El campo role es requerido o el valor es inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: error
                message: "El campo role es requerido"
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "500":
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT obtenido al hacer login en `POST /api/sessions/login`.
        Se puede pasar como header `Authorization: Bearer <token>` o
        automáticamente como cookie `jwt=<token>`.

  parameters:
    UserId:
      name: uid
      in: path
      required: true
      description: ID de MongoDB del usuario (24 caracteres hexadecimales).
      schema:
        type: string
        pattern: '^[a-fA-F0-9]{24}$'
        example: "647fa8c9e46dbc5a20320181"

  responses:
    Unauthorized:
      description: No autenticado. Se requiere JWT válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: "No autorizado. Por favor inicia sesión."

    Forbidden:
      description: Autenticado pero sin permisos suficientes.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: "No tienes permisos para realizar esta acción."

    NotFound:
      description: Recurso no encontrado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: "Usuario con ID 647fa8c9e46dbc5a20320181 no encontrado"

    InvalidId:
      description: El ID proporcionado no tiene formato de ObjectId válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: "ID de usuario inválido"

    InternalError:
      description: Error inesperado en el servidor.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: error
            message: "Error interno del servidor"

  schemas:
    User:
      type: object
      description: Vista estándar del usuario (sin datos sensibles).
      properties:
        _id:
          type: string
          description: ID autogenerado de MongoDB.
          example: "647fa8c9e46dbc5a20320181"
        first_name:
          type: string
          description: Nombre del usuario.
          example: "Juan"
        last_name:
          type: string
          description: Apellido del usuario.
          example: "Acosta"
        email:
          type: string
          format: email
          description: Email del usuario.
          example: "juan@gmail.com"
        age:
          type: integer
          description: Edad del usuario.
          example: 25
        role:
          type: string
          description: Rol del usuario en el sistema.
          enum: [user, admin, premium]
          example: "user"
        pets:
          type: array
          description: IDs de mascotas adoptadas por el usuario.
          items:
            type: string
          example: []

    UserAdmin:
      type: object
      description: Vista extendida del usuario (disponible para administradores).
      properties:
        _id:
          type: string
          example: "647fa8c9e46dbc5a20320181"
        first_name:
          type: string
          example: "Juan"
        last_name:
          type: string
          example: "Acosta"
        email:
          type: string
          format: email
          example: "juan@gmail.com"
        age:
          type: integer
          example: 25
        role:
          type: string
          enum: [user, admin, premium]
          example: "user"
        cart:
          type: string
          description: ID del carrito asociado al usuario.
          example: "647fa8c9e46dbc5a20320182"
        pets:
          type: array
          description: IDs de mascotas adoptadas.
          items:
            type: string
          example: []
        createdAt:
          type: string
          format: date-time
          description: Fecha de creación del usuario.
          example: "2024-01-15T10:30:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Fecha de última actualización.
          example: "2024-06-20T14:45:00.000Z"

    UserMinimal:
      type: object
      description: Vista mínima del usuario (usada en confirmaciones de eliminación).
      properties:
        _id:
          type: string
          example: "647fa8c9e46dbc5a20320181"
        email:
          type: string
          format: email
          example: "juan@gmail.com"
        role:
          type: string
          example: "user"

    UpdateUser:
      type: object
      description: Campos actualizables de un usuario. Todos son opcionales.
      properties:
        first_name:
          type: string
          minLength: 1
          maxLength: 50
          example: "Juan Carlos"
        last_name:
          type: string
          minLength: 1
          maxLength: 50
          example: "Acosta"
        age:
          type: integer
          minimum: 1
          maximum: 120
          example: 26

    ErrorResponse:
      type: object
      properties:
        status:
          type: string
          example: error
        message:
          type: string
          example: "Descripción del error"
